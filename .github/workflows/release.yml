name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      prefix: ${{ steps.version.outputs.prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Validate tag against frontend, Tauri and Cargo versions
        id: version
        run: node scripts/github-release.mjs prepare

  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.arch }}
    needs: [prepare, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache-key: release-${{ matrix.arch }}
      - name: Build app and DMG
        run: pnpm build:mac
      - name: Verify packaged app, architecture, icon and Rust workers
        run: node scripts/github-release.mjs verify-dmg '${{ matrix.arch }}'
      - name: Upload verified installer and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.arch }}
          path: |
            releases/${{ needs.prepare.outputs.prefix }}_${{ matrix.arch }}.dmg
            releases/${{ needs.prepare.outputs.prefix }}_${{ matrix.arch }}.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish complete release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: macos-*
          path: releases
          merge-multiple: true
          digest-mismatch: error
      - name: Check both architectures and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-release.mjs publish
