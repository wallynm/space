name: Setup Space build
description: Install the pinned Node, pnpm and Rust toolchains with dependency caches
inputs:
  cache-key:
    description: Separate test and release Cargo caches
    required: true
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: pnpm
    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      with:
        toolchain: '1.94.1'
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: src-tauri
        shared-key: ${{ inputs.cache-key }}
    - shell: bash
      run: pnpm install --frozen-lockfile
